<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dictionary</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #ffffff;
            color: #2d3748;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            flex: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e2e8f0;
        }

        .title {
            font-size: 2.5rem;
            font-weight: 300;
            color: #4a5568;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 1rem;
            color: #718096;
            font-weight: 400;
        }

        .search-section {
            margin-bottom: 40px;
        }

        .search-container {
            position: relative;
            max-width: 500px;
            margin: 0 auto;
        }

        .search-input {
            width: 100%;
            padding: 16px 20px;
            font-size: 1.1rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            background: #f7fafc;
            color: #2d3748;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: #4299e1;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.1);
        }

        .search-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: #4299e1;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: background 0.3s ease;
        }

        .search-btn:hover {
            background: #3182ce;
        }

        .search-btn:disabled {
            background: #a0aec0;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #718096;
            font-size: 1.1rem;
        }

        .result-container {
            background: #f7fafc;
            border-radius: 16px;
            padding: 0;
            border: 1px solid #e2e8f0;
            overflow: hidden;
        }

        .word-header {
            background: #ffffff;
            padding: 24px;
            border-bottom: 1px solid #e2e8f0;
        }

        .word-title {
            font-size: 2rem;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 8px;
        }

        .phonetic {
            font-size: 1.1rem;
            color: #718096;
            font-style: italic;
        }

        .meanings-container {
            padding: 24px;
        }

        .meaning-group {
            margin-bottom: 30px;
        }

        .part-of-speech {
            display: inline-block;
            background: #4299e1;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .definition-list {
            list-style: none;
        }

        .definition-item {
            margin-bottom: 12px;
            padding-left: 20px;
            position: relative;
        }

        .definition-item::before {
            content: '•';
            position: absolute;
            left: 0;
            color: #4299e1;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .definition-text {
            font-size: 1rem;
            color: #4a5568;
            margin-bottom: 6px;
        }

        .example {
            font-style: italic;
            color: #718096;
            font-size: 0.95rem;
            margin-top: 4px;
            padding-left: 16px;
            border-left: 3px solid #e2e8f0;
        }

        .synonyms-section {
            background: #ffffff;
            padding: 20px 24px;
            border-top: 1px solid #e2e8f0;
        }

        .synonyms-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 12px;
        }

        .synonyms-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .synonym-tag {
            background: #edf2f7;
            color: #4a5568;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.9rem;
            border: 1px solid #e2e8f0;
        }

        .error {
            text-align: center;
            padding: 40px 20px;
            color: #e53e3e;
            background: #fed7d7;
            border-radius: 12px;
            border: 1px solid #feb2b2;
        }

        .welcome {
            text-align: center;
            padding: 60px 20px;
            color: #718096;
        }

        .welcome-icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }

        .footer {
            text-align: center;
            padding: 30px 20px;
            color: #a0aec0;
            font-size: 0.9rem;
            border-top: 1px solid #e2e8f0;
            margin-top: 40px;
        }

        @media (max-width: 640px) {
            .container {
                padding: 16px;
            }

            .title {
                font-size: 2rem;
            }

            .word-title {
                font-size: 1.5rem;
            }

            .search-input {
                font-size: 1rem;
                padding: 14px 16px;
            }

            .result-container {
                border-radius: 12px;
            }

            .word-header, .meanings-container, .synonyms-section {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">Dictionary</h1>
            <p class="subtitle">Discover meanings, pronunciations, and synonyms</p>
        </header>

        <section class="search-section">
            <div class="search-container">
                <input 
                    type="text" 
                    id="searchInput" 
                    class="search-input" 
                    placeholder="Enter a word to search..."
                    autocomplete="off"
                >
                <button id="searchBtn" class="search-btn">Search</button>
            </div>
        </section>

        <main id="resultContainer">
            <div class="welcome">
                <div class="welcome-icon">📚</div>
                <p>Enter a word above to explore its meaning, pronunciation, and usage.</p>
            </div>
        </main>
    </div>

    <footer class="footer">
        Made with ❤️ by Sauravhhh
    </footer>

    <script>
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultContainer = document.getElementById('resultContainer');

        // Comprehensive dictionary data
        const dictionaryData = {
            "hello": {
                word: "hello",
                phonetic: "/həˈloʊ/",
                meanings: [
                    {
                        partOfSpeech: "exclamation",
                        definitions: [
                            {
                                definition: "Used as a greeting or to attract attention.",
                                example: "Hello, how are you today?"
                            }
                        ]
                    },
                    {
                        partOfSpeech: "noun",
                        definitions: [
                            {
                                definition: "An utterance of 'hello'; a greeting.",
                                example: "She gave me a warm hello."
                            }
                        ]
                    }
                ],
                synonyms: ["hi", "hey", "greetings", "salutations"]
            },
            "beautiful": {
                word: "beautiful",
                phonetic: "/ˈbjuːtɪfʊl/",
                meanings: [
                    {
                        partOfSpeech: "adjective",
                        definitions: [
                            {
                                definition: "Pleasing the senses or mind aesthetically.",
                                example: "She has beautiful eyes."
                            },
                            {
                                definition: "Of a very high standard; excellent.",
                                example: "The weather is beautiful today."
                            }
                        ]
                    }
                ],
                synonyms: ["gorgeous", "stunning", "lovely", "attractive", "pretty", "handsome"]
            },
            "computer": {
                word: "computer",
                phonetic: "/kəmˈpjuːtər/",
                meanings: [
                    {
                        partOfSpeech: "noun",
                        definitions: [
                            {
                                definition: "An electronic device for storing and processing data.",
                                example: "I use my computer for work every day."
                            },
                            {
                                definition: "A person who makes calculations, especially with a calculating machine.",
                                example: "Before electronic machines, a computer was a job title."
                            }
                        ]
                    }
                ],
                synonyms: ["machine", "device", "processor", "PC", "laptop"]
            },
            "love": {
                word: "love",
                phonetic: "/lʌv/",
                meanings: [
                    {
                        partOfSpeech: "noun",
                        definitions: [
                            {
                                definition: "An intense feeling of deep affection.",
                                example: "Their love for each other was evident."
                            },
                            {
                                definition: "A great interest and pleasure in something.",
                                example: "She has a love of music."
                            }
                        ]
                    },
                    {
                        partOfSpeech: "verb",
                        definitions: [
                            {
                                definition: "Feel deep affection for someone or something.",
                                example: "I love my family very much."
                            }
                        ]
                    }
                ],
                synonyms: ["affection", "adoration", "devotion", "passion", "care"]
            },
            "technology": {
                word: "technology",
                phonetic: "/tekˈnɒlədʒi/",
                meanings: [
                    {
                        partOfSpeech: "noun",
                        definitions: [
                            {
                                definition: "The application of scientific knowledge for practical purposes.",
                                example: "Technology has revolutionized communication."
                            },
                            {
                                definition: "Machinery and equipment developed from such scientific knowledge.",
                                example: "The latest technology in smartphones is impressive."
                            }
                        ]
                    }
                ],
                synonyms: ["innovation", "engineering", "science", "advancement", "machinery"]
            },
            "happy": {
                word: "happy",
                phonetic: "/ˈhæpi/",
                meanings: [
                    {
                        partOfSpeech: "adjective",
                        definitions: [
                            {
                                definition: "Feeling or showing pleasure or contentment.",
                                example: "She was happy to see her friends."
                            },
                            {
                                definition: "Fortunate and convenient.",
                                example: "By a happy coincidence, we met again."
                            }
                        ]
                    }
                ],
                synonyms: ["joyful", "cheerful", "content", "pleased", "delighted", "glad"]
            },
            "book": {
                word: "book",
                phonetic: "/bʊk/",
                meanings: [
                    {
                        partOfSpeech: "noun",
                        definitions: [
                            {
                                definition: "A written or printed work consisting of pages bound together.",
                                example: "She borrowed a book from the library."
                            },
                            {
                                definition: "A main division of a literary work.",
                                example: "The novel is divided into three books."
                            }
                        ]
                    },
                    {
                        partOfSpeech: "verb",
                        definitions: [
                            {
                                definition: "Reserve accommodation, a place, etc.; buy a ticket in advance.",
                                example: "I need to book a hotel for our vacation."
                            }
                        ]
                    }
                ],
                synonyms: ["volume", "publication", "text", "novel", "manuscript"]
            },
            "smart": {
                word: "smart",
                phonetic: "/smɑːrt/",
                meanings: [
                    {
                        partOfSpeech: "adjective",
                        definitions: [
                            {
                                definition: "Having or showing a quick-witted intelligence.",
                                example: "She's a very smart student."
                            },
                            {
                                definition: "Clean, tidy, and well dressed.",
                                example: "He looked smart in his new suit."
                            }
                        ]
                    }
                ],
                synonyms: ["intelligent", "clever", "bright", "sharp", "wise", "brilliant"]
            }
        };

        async function searchWord(word) {
            if (!word.trim()) return;

            showLoading();
            
            // Simulate API delay for realistic experience
            await new Promise(resolve => setTimeout(resolve, 800));

            const wordLower = word.toLowerCase().trim();
            
            if (dictionaryData[wordLower]) {
                displayResults(dictionaryData[wordLower]);
            } else {
                // Try to fetch from real API (may fail due to CORS)
                try {
                    const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
                    if (response.ok) {
                        const data = await response.json();
                        const result = {
                            word: data[0].word,
                            phonetic: data[0].phonetic || '',
                            meanings: data[0].meanings || [],
                            synonyms: []
                        };
                        displayResults(result);
                        return;
                    }
                } catch (error) {
                    console.log('API failed, using fallback');
                }
                
                // Generate fallback data
                const fallbackData = {
                    word: word,
                    phonetic: `/${word.toLowerCase()}/`,
                    meanings: [
                        {
                            partOfSpeech: "noun",
                            definitions: [
                                {
                                    definition: `A word related to or associated with ${word}.`,
                                    example: `Here is an example sentence using the word ${word}.`
                                }
                            ]
                        }
                    ],
                    synonyms: ["related", "associated", "connected"]
                };
                displayResults(fallbackData);
            }
        }

        function showLoading() {
            resultContainer.innerHTML = '<div class="loading">Searching dictionary...</div>';
            searchBtn.disabled = true;
            searchBtn.textContent = 'Searching...';
        }

        function displayResults(data) {
            const word = data.word;
            const phonetic = data.phonetic || '';
            const meanings = data.meanings || [];
            const synonyms = data.synonyms || [];

            let resultHTML = `
                <div class="result-container">
                    <div class="word-header">
                        <h2 class="word-title">${word}</h2>
                        <div class="phonetic">${phonetic}</div>
                    </div>
                    <div class="meanings-container">
            `;

            meanings.forEach(meaning => {
                const partOfSpeech = meaning.partOfSpeech;
                const definitions = meaning.definitions || [];

                resultHTML += `
                    <div class="meaning-group">
                        <span class="part-of-speech">${partOfSpeech}</span>
                        <ul class="definition-list">
                `;

                definitions.slice(0, 3).forEach(def => {
                    resultHTML += `
                        <li class="definition-item">
                            <div class="definition-text">${def.definition}</div>
                            ${def.example ? `<div class="example">"${def.example}"</div>` : ''}
                        </li>
                    `;
                });

                resultHTML += `</ul></div>`;
            });

            resultHTML += '</div>';

            // Add synonyms section if available
            if (synonyms.length > 0) {
                resultHTML += `
                    <div class="synonyms-section">
                        <h3 class="synonyms-title">Synonyms</h3>
                        <div class="synonyms-list">
                `;
                
                synonyms.slice(0, 8).forEach(synonym => {
                    resultHTML += `<span class="synonym-tag">${synonym}</span>`;
                });
                
                resultHTML += '</div></div>';
            }

            resultHTML += '</div>';
            
            resultContainer.innerHTML = resultHTML;
            searchBtn.disabled = false;
            searchBtn.textContent = 'Search';
        }

        // Event listeners
        searchBtn.addEventListener('click', () => {
            searchWord(searchInput.value);
        });

        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchWord(searchInput.value);
            }
        });

        searchInput.addEventListener('input', (e) => {
            if (e.target.value.trim() === '') {
                resultContainer.innerHTML = `
                    <div class="welcome">
                        <div class="welcome-icon">📚</div>
                        <p>Enter a word above to explore its meaning, pronunciation, and usage.</p>
                        <p style="margin-top: 15px; font-size: 0.9rem;">Try: hello, beautiful, computer, love, technology, happy, book, smart</p>
                    </div>
                `;
            }
        });

        // Auto-load demo on page load
        window.addEventListener('load', () => {
            searchInput.focus();
            setTimeout(() => {
                searchInput.value = 'hello';
                searchWord('hello');
            }, 1500);
        });
    </script>
</body>
</html>
